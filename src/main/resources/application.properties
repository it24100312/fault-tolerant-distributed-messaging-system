# Default local multi-node cluster configuration
server.host=localhost
server.port=6001
cluster.nodeCount=3
cluster.nodes=node1:localhost:6001,node2:localhost:6002,node3:localhost:6003

# Timing
heartbeat.intervalMs=2000
election.timeoutMs=5000

# Replication
replication.factor=2

# Dashboard UI
ui.enabled=true
ui.port=8080
